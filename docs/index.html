<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal</title>
<style>
:root {
  --bg: #FFFFFF; --ink: #000000; --card: #F5F5F5; --border: #CCCCCC;
  --accent: #006400; --muted: #444444; --disagree: #8B4513;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --ink: #FFFFFF; --card: #1C1C1C; --border: #444444;
    --accent: #00FF00; --muted: #CCCCCC; --disagree: #FFA500;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  max-width: 720px; margin-left: auto; margin-right: auto;
}
h1 { font-size: 1.3rem; margin: 4px 0 16px; }
h2 { font-size: 1rem; margin: 24px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab-btn {
  flex: 1; padding: 12px; border-radius: 16px; border: 1px solid var(--border);
  background: var(--card); color: var(--ink); font-size: 1rem; font-weight: 700;
  text-align: center; cursor: pointer;
}
.tab-btn.active { border-color: var(--accent); color: var(--accent); }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.agree-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 12px 16px; margin-bottom: 10px;
}
.agree-match { font-weight: 600; margin-bottom: 2px; }
.agree-date { display: block; font-weight: 400; font-size: 0.78rem; color: var(--muted); margin: 2px 0 6px; }
.agree-line { font-size: 0.95rem; }
.market-tag {
  display: inline-block; font-size: 0.8rem; font-weight: 600; color: var(--accent); margin-right: 6px;
}
.odds { color: var(--muted); font-variant-numeric: tabular-nums; }
.match-block {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 12px 16px; margin-bottom: 10px;
}
.match-head { font-weight: 600; margin-bottom: 8px; }
.match-meta { display: block; font-weight: 400; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.mkt-row {
  display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 0.9rem; padding: 4px 0;
  border-top: 1px solid var(--border);
}
.mkt-row:first-of-type { border-top: none; }
.mkt-label { font-weight: 600; width: 42px; flex-shrink: 0; }
.mkt-row.agree .mkt-label { color: var(--accent); }
.mkt-row.disagree .mkt-label { color: var(--disagree); }
.mkt-si, .mkt-a { font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); }
.updated { color: var(--muted); font-size: 0.8rem; margin-bottom: 20px; }
</style>
</head>
<body>
<h1>Signal</h1>
<div class="updated">Updated 23 Aug 2026, 09:25 UTC</div>

<div class="tabs">
  <div class="tab-btn active" data-tab="nrl">NRL</div>
  <div class="tab-btn" data-tab="afl">AFL</div>
</div>

<div class="tab-panel active" id="panel-nrl">
<h2>Agreed Picks</h2>
<p class="empty">No agreements this round.</p>
<h2>All Matches</h2>

</div>

<div class="tab-panel" id="panel-afl">
<h2>Agreed Picks</h2>
<p class="empty">No agreements this round.</p>
<h2>All Matches</h2>

</div>

<script>
document.querySelectorAll('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});
</script>
</body>
</html>
